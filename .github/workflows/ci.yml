name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    name: Scaffold / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development package
        run: python -m pip install -e '.[dev]'
      - name: Check scaffold and installed CLI
        run: python scripts/check.py
      - name: Build sdist and wheel
        run: python -m build
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/bedwars-wheel"
          "$RUNNER_TEMP/bedwars-wheel/bin/python" -m pip install --no-deps dist/*.whl
      - name: Smoke check wheel outside the checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          "$RUNNER_TEMP/bedwars-wheel/bin/python" -m bedwars_arena --version
          "$RUNNER_TEMP/bedwars-wheel/bin/bedwars-arena" info --json

  training:
    name: Shared PPO / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install optional training dependencies
        run: python -m pip install -e '.[dev,training]'
      - name: Test PPO, trajectories and checkpoint recovery
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python -m unittest discover -s tests -p test_l1_training.py
