<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BedWars Arena · 对局回放</title>
<style>
:root{color-scheme:dark;--page:#0b1018;--surface:#121b27;--surface2:#192536;--line:#293a4d;--text:#edf4f6;--muted:#9cabb9;--mint:#8ee1c4;--red:#ff7883;--blue:#7aafff;--gold:#e7c884;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -30%,#263b4b 0,transparent 55%),var(--page);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit}button,select{color:var(--text);cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--mint);outline-offset:3px}button:disabled{opacity:.45;cursor:default}
.topbar{max-width:1640px;margin:auto;padding:19px 28px 14px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:12px;align-items:center;min-width:0}.brand-mark{width:39px;height:39px;display:grid;place-items:center;background:var(--mint);color:#112821;border-radius:11px;font-size:13px;font-weight:900;letter-spacing:-.05em}.brand h1{font-size:16px;line-height:1.2;margin:0;letter-spacing:.015em}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9fddc8;border:1px solid #315d51;background:#142a26;padding:6px 10px;border-radius:100px;white-space:nowrap}
main{max-width:1640px;margin:auto;padding:0 28px 28px}.scoreboard{display:grid;grid-template-columns:1fr 180px 1fr;gap:9px;margin-bottom:12px}.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}.score.blue{flex-direction:row-reverse;text-align:right}.score-name{font-size:12px;letter-spacing:.1em;font-weight:800;color:var(--red)}.score.blue .score-name{color:var(--blue)}.score-bed{font-size:16px;font-weight:720}.score-members{color:var(--muted);font-size:12px;white-space:nowrap}.score-center{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);background:#111d29;border-radius:var(--radius);font-variant-numeric:tabular-nums}.score-center strong{font-size:19px;letter-spacing:.03em;line-height:1.15}.score-center span{color:var(--muted);font-size:11px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.section-head{min-height:56px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#8c9fb1;font-weight:800}.section-title{font-size:14px;font-weight:750}.sub{color:var(--muted);font-size:12px}.status{font-size:11px;color:var(--mint);border:1px solid #365f56;background:#142e29;border-radius:100px;padding:4px 9px;white-space:nowrap}
.canvas-wrap{position:relative;background:#09131e;overflow:hidden}canvas{display:block;width:100%;height:auto;aspect-ratio:2/1;touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}.map-tools{position:absolute;right:12px;top:12px;display:flex;gap:5px}.tool,.button,select{border:1px solid #3a4b5d;background:#1b2b3b;border-radius:8px;padding:7px 10px;min-height:34px}.tool{min-width:34px;padding:5px 8px}.tool.active{background:#285247;border-color:#68cdb0;color:#d7fff1}.tool:hover,.button:hover,select:hover{background:#294154}.map-caption{position:absolute;left:14px;bottom:12px;pointer-events:none;color:#afc1cd;font-size:11px;text-shadow:0 1px 3px #000}.map-caption strong{color:#e9f7f3}.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 16px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.controls{border-top:1px solid var(--line);padding:13px 16px 15px}.buttons{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.button.primary{background:var(--mint);color:#10261e;border-color:var(--mint);font-weight:800;min-width:85px}.button.primary:hover{background:#b3efd9}.clock{font-variant-numeric:tabular-nums;color:#e4f4f3;margin-left:auto;font-size:12px}.range-wrap{position:relative;padding-top:9px}.markers{height:9px;position:relative;margin:0 8px}.marker{position:absolute;top:1px;border:0;padding:0;width:7px;height:7px;min-height:0;border-radius:50%;background:var(--gold);transform:translateX(-50%)}.marker.bed{background:#ff7883}.marker.final{background:#bf9aff}.marker.recover{background:var(--gold)}.slider{display:block;width:100%;accent-color:var(--mint);margin:0;cursor:pointer}.range-labels{display:flex;justify-content:space-between;color:#8296a7;font-size:11px;font-variant-numeric:tabular-nums}.keyboard{color:#879bae;font-size:11px;margin-top:8px}
.inspector-head{padding:12px 16px;border-bottom:1px solid var(--line)}.players{padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.player{display:block;text-align:left;width:100%;min-width:0;padding:9px;background:#172534;border:1px solid #293c4e;border-radius:9px;cursor:pointer}.player:hover{border-color:#6e8799}.player.selected{border-color:var(--mint);box-shadow:0 0 0 1px #8ee1c440}.player-title{font-weight:750;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-title.red{color:var(--red)}.player-title.blue{color:var(--blue)}.player-meta{color:#b9c9d5;font-size:11px}.health{height:4px;border-radius:3px;background:#304354;margin:6px 0}.health span{display:block;height:100%;border-radius:3px;background:#8cddb0}.inspector{border-top:1px solid var(--line);padding:13px 16px;min-height:170px}.inspector-title{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.inspector-title strong{font-size:15px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.info-label{color:#8fa2b2;font-size:10px;letter-spacing:.07em}.info-value{font-size:12px;margin-top:2px;overflow-wrap:anywhere}.inventory{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.chip{font-size:11px;color:#dbe8eb;border:1px solid #354c5c;background:#1b2e3c;border-radius:6px;padding:3px 6px}.action-row{margin-top:12px;padding-top:10px;border-top:1px solid #26394a;color:#c2d1da;font-size:12px}.raw{margin:12px 0 0;color:#9ab0bf;font-size:11px}.raw summary{cursor:pointer}.raw pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.45 ui-monospace,monospace;max-height:200px;overflow:auto;color:#abc0ce}
.timeline{margin-top:12px}.timeline .section-head{flex-wrap:wrap}.event-count{font-size:11px;color:var(--muted);font-weight:400;margin-left:5px}.event-tools{display:flex;gap:7px;align-items:center}.event-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;padding:12px 14px;min-height:75px}.event{text-align:left;min-width:0;border:1px solid #2c4050;background:#172637;border-radius:9px;padding:9px 10px}.event:hover{background:#21374a}.event b{display:block;color:#a8e6d2;font-size:11px;font-variant-numeric:tabular-nums}.event span{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.selected{border-color:var(--mint)}.empty{color:var(--muted);padding:8px;font-size:12px}.event-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 14px 13px;flex-wrap:wrap}.event-pages{display:flex;align-items:center;gap:7px}.event-detail{color:#a9bdca;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;padding:0 16px 14px;max-height:180px;overflow:auto}
@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr) 290px}.scoreboard{grid-template-columns:1fr 140px 1fr}}@media(max-width:760px){.topbar{padding:14px 15px 11px}main{padding:0 12px 18px}.layout{grid-template-columns:1fr}.scoreboard{grid-template-columns:1fr 92px 1fr}.score{padding:10px;display:block}.score.blue{display:block}.score-members{white-space:normal}.score-bed{font-size:13px}.score-center strong{font-size:15px}.inspector{min-height:0}.players{grid-template-columns:repeat(4,minmax(0,1fr))}.event-list{grid-template-columns:repeat(2,minmax(0,1fr))}.clock{margin-left:0}.map-caption{display:none}}@media(max-width:430px){.players{grid-template-columns:repeat(2,minmax(0,1fr))}.top-label{display:none}.score-members{font-size:10px}.event-list{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark">BA</div><div><h1>BedWars Arena <span style="color:#88d9be">/</span> 对局回放</h1><p id="subtitle"></p></div></div><span class="top-label">REPLAY · 本地记录</span></header>
<main>
<div class="scoreboard" aria-label="队伍与当前时刻">
  <div class="score red"><div><div id="red-name" class="score-name"></div><div id="red-bed" class="score-bed"></div></div><div id="red-members" class="score-members"></div></div>
  <div class="score-center"><strong id="score-time">00:00</strong><span id="score-tick">TICK 0</span></div>
  <div class="score blue"><div><div id="blue-name" class="score-name"></div><div id="blue-bed" class="score-bed"></div></div><div id="blue-members" class="score-members"></div></div>
</div>
<div class="layout">
<section class="panel"><div class="section-head"><div><div class="eyebrow">MAP / LIVE STATE</div><div class="section-title">三岛战场</div></div><span id="match-status" class="status"></span></div>
<div class="canvas-wrap"><canvas id="field" width="1280" height="640" tabindex="0" aria-label="二维战场；可拖动、缩放或点击玩家"></canvas><div class="map-tools"><button id="zoom-out" class="tool" title="缩小" aria-label="缩小">−</button><button id="zoom-in" class="tool" title="放大" aria-label="放大">＋</button><button id="follow" class="tool" title="跟随选中玩家">跟随</button><button id="reset-view" class="tool" title="回到全图">全图</button></div><div class="map-caption"><strong>拖动</strong> 平移 · <strong>滚轮</strong> 缩放 · <strong>点击</strong> 选择玩家</div></div>
<div class="legend"><span><i class="dot" style="background:#657d8b"></i>原始地面</span><span><i class="dot" style="background:#e8c97c"></i>羊毛桥 / 墙</span><span><i class="dot" style="background:#ff7883"></i><span id="team0-label"></span></span><span><i class="dot" style="background:#7aafff"></i><span id="team1-label"></span></span><span><i class="dot" style="background:#e5f0f2"></i>地面物品</span><span><i class="dot" style="background:#90e1c4"></i>出生保护</span></div>
<div class="controls"><div class="buttons"><button id="previous-event" class="button" title="跳到上一个关键事件">◀ 事件</button><button id="back" class="button" title="单步后退一个 tick" aria-label="单步后退">−1</button><button id="play" class="button primary">▶ 播放</button><button id="forward" class="button" title="单步前进一个 tick" aria-label="单步前进">+1</button><button id="next-event" class="button" title="跳到下一个关键事件">事件 ▶</button><label for="speed" class="sub">速度</label><select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option></select><span class="clock" id="clock"></span></div><div class="range-wrap"><div class="markers" id="markers" aria-label="关键事件标记"></div><input id="slider" class="slider" type="range" min="0" max="0" value="0" aria-label="回放时间轴"><div class="range-labels"><span id="start-label"></span><span id="end-label"></span></div></div><div class="keyboard">空格播放 / 暂停 · ← → 逐 tick · 时间轴上的彩点可跳转至关键事件</div></div></section>
<aside class="panel"><div class="inspector-head"><div class="eyebrow">PLAYER / INSPECTOR</div><div class="section-title">玩家状态</div></div><div id="players" class="players"></div><div id="player-detail" class="inspector"></div></aside>
</div>
<section class="panel timeline"><div class="section-head"><div><div class="eyebrow">MATCH / EVENTS</div><div class="section-title">事件记录 <span id="event-count" class="event-count"></span></div></div><div class="event-tools"><label class="sub" for="filter">筛选</label><select id="filter"><option value="all">所有关键事件</option><option value="block_broken">羊毛回收 / 拆除</option><option value="bed_destroyed">床被破坏</option><option value="final">失床后最终淘汰</option><option value="movement_collision">碰撞</option><option value="melee_hit">近战命中</option><option value="item_purchased">购买</option><option value="block_placed">放置方块</option></select></div></div><div id="events" class="event-list"></div><div class="event-footer"><span class="sub">选择事件以跳转到对应 tick</span><div class="event-pages"><button id="event-prev-page" class="tool" aria-label="上一页事件">‹</button><span id="event-page" class="sub"></span><button id="event-next-page" class="tool" aria-label="下一页事件">›</button></div></div><div id="event-detail" class="event-detail">选择事件以查看其原始记录。</div></section>
</main>
<script>
'use strict';
const data=/*__REPLAY_DATA__*/;
const frames=data.frames, facts=data.events, map=data.definitions.map, profile=data.definitions.profile;
const el=id=>document.getElementById(id), clone=value=>structuredClone(value);
const tickToIndex=new Map(frames.map((frame,i)=>[frame.tick,i]));
const labels={player_spawned:'玩家出生',resource_generated:'资源生成',item_picked_up:'拾取物品',item_purchased:'购买',block_placed:'放置方块',block_broken:'拆除方块',bed_destroyed:'床被破坏',movement_collision:'碰撞',melee_hit:'近战命中',attack_blocked:'攻击被阻挡',player_died:'玩家死亡',player_respawned:'复活',team_eliminated:'队伍淘汰',match_finished:'对局结束',protection_expired:'保护结束',resource_dropped:'丢弃资源'};
const itemNames={iron:'铁',wool:'羊毛',wooden_sword:'木剑',iron_sword:'铁剑',shears:'剪刀'};
const actionNames={move:'移动',attack:'攻击',break_block:'拆除',break_bed:'破床',place_block:'放置'};
const significant=new Set(['block_broken','bed_destroyed','movement_collision','player_died','player_respawned','melee_hit','item_purchased','block_placed','team_eliminated','match_finished']);
const important=f=>f.kind==='bed_destroyed'||(f.kind==='player_died'&&f.payload.final)||(f.kind==='block_broken'&&f.payload.recovery&&Object.values(f.payload.recovery).some(Boolean));
const keyEvents=facts.filter(f=>important(f)&&tickToIndex.has(f.happened_at));
const rate=profile.game.ticks_per_second, bounds=map.bounds, pageSize=16;
const sideOf=teamId=>teamId===map.teams[0].team_id?'red':'blue';
let state=clone(data.initial_state),idx=0,selected=null,selectedEvent=null,playing=false,last=0,acc=0,eventPage=0,filtered=[];
const cache=new Map([[0,clone(state)]]);
const view={zoom:1,x:(bounds.min_x+bounds.max_x)/2,z:(bounds.min_z+bounds.max_z)/2,follow:false,drag:null};
function apply(ops){for(const op of ops){let obj=state;for(const key of op.path.slice(0,-1))obj=obj[key];const key=op.path.at(-1);if(op.op==='delete')delete obj[key];else obj[key]=clone(op.value)}}
function seek(target){target=Math.max(0,Math.min(frames.length-1,target));if(target<idx){let start=0;for(const key of cache.keys())if(key<=target&&key>start)start=key;state=clone(cache.get(start));idx=start}while(idx<target){idx++;apply(frames[idx].changes);if(idx%100===0&&!cache.has(idx)){cache.set(idx,clone(state));if(cache.size>12){const oldest=[...cache.keys()].find(key=>key!==0);cache.delete(oldest)}}}render()}
function pause(){playing=false;last=0;el('play').textContent='▶ 播放'}
function safe(value){return value===null||value===undefined?'—':String(value)}
function timeText(tick){const seconds=Math.floor(tick/rate);return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function text(parent,tag,value,cls){const node=document.createElement(tag);if(cls)node.className=cls;node.textContent=value;parent.appendChild(node);return node}
function eventLabel(f){if(f.kind==='player_died'&&f.payload.final)return '失床后最终淘汰';if(f.kind==='block_broken'&&f.payload.recovery&&Object.values(f.payload.recovery).some(Boolean))return '拆除与羊毛回收';return labels[f.kind]||f.kind}
function actionLabel(action){if(!action)return '无';const target=action.target||{}, name=actionNames[action.kind]||action.kind;let dest=target.player_id||target.team_id||((target.x!==undefined&&target.z!==undefined)?`(${target.x}, ${target.z})`:'');return `${name}${dest?' · '+dest:''}${action.progress?` · ${action.progress} tick`:''}`}
function appendInfo(parent,label,value){const item=document.createElement('div');text(item,'div',label,'info-label');text(item,'div',value,'info-value');parent.appendChild(item)}
function score(){for(const team of map.teams){const teamState=state.teams[team.team_id],side=sideOf(team.team_id);if(!teamState)continue;el(side+'-name').textContent=team.team_id.toUpperCase()+' TEAM';el(side+'-bed').textContent=teamState.bed_state.status==='present'?'床仍在':'床已被破坏';const people=Object.values(state.players).filter(p=>p.team_id===team.team_id);el(side+'-members').textContent=people.map(p=>`${p.player_id} ${p.life.kind==='alive'?'存活':p.life.kind==='respawning'?'复活中':'淘汰'}`).join('  ·  ')}el('score-time').textContent=timeText(state.tick);el('score-tick').textContent=`TICK ${state.tick}`}
function inspect(){const panel=el('players');panel.replaceChildren();for(const entry of data.definitions.scenario.players){const p=state.players[entry.player_id],life=p.life;const card=document.createElement('button');card.className='player'+(selected===p.player_id?' selected':'');card.onclick=()=>{selected=p.player_id;render()};text(card,'div',p.player_id,'player-title '+sideOf(p.team_id));const status=life.kind==='alive'?`HP ${life.vitality.health.toFixed(1)}`:life.kind==='respawning'?`复活 ${Math.max(0,life.respawn_at-state.tick)}t`:'已淘汰';if(life.kind==='alive'){const bar=document.createElement('div');bar.className='health';const fill=document.createElement('span');fill.style.width=`${Math.max(0,Math.min(100,life.vitality.health/profile.combat.max_hp*100))}%`;bar.appendChild(fill);card.appendChild(bar)}text(card,'div',status,'player-meta');panel.appendChild(card)}
const target=el('player-detail');target.replaceChildren();const p=state.players[selected];if(!p){text(target,'p','选择一名玩家查看详情。','sub');return}const life=p.life,title=document.createElement('div');title.className='inspector-title';text(title,'strong',p.player_id);text(title,'span',`生命 ${p.life_index}`,'sub');target.appendChild(title);const grid=document.createElement('div');grid.className='info-grid';if(life.kind==='alive'){const pos=life.spatial;appendInfo(grid,'位置',`${pos.x.toFixed(2)}, ${pos.z.toFixed(2)}`);appendInfo(grid,'手持',itemNames[life.held_item]||safe(life.held_item));const protection=life.effects.filter(e=>e.effect_type==='spawn_protection'&&e.expires_at>state.tick);appendInfo(grid,'出生保护',protection.length?`${protection[0].expires_at-state.tick} tick`:'无');appendInfo(grid,'防具等级',safe(p.progression.armor_tier));target.appendChild(grid);text(target,'div','背包','info-label');const inventory=document.createElement('div');inventory.className='inventory';for(const [item,count] of Object.entries(life.inventory))text(inventory,'span',`${itemNames[item]||item} ×${count}`,'chip');if(!inventory.children.length)text(inventory,'span','空','sub');target.appendChild(inventory);const actions=document.createElement('div');actions.className='action-row';text(actions,'div',`移动：${actionLabel(life.movement)}`);text(actions,'div',`交互：${actionLabel(life.interaction)}`);target.appendChild(actions)}else{appendInfo(grid,'状态',life.kind==='respawning'?'等待复活':'已淘汰');appendInfo(grid,'时刻',life.kind==='respawning'?`tick ${life.respawn_at} 复活`:`tick ${life.eliminated_at}`);target.appendChild(grid)}const details=document.createElement('details');details.className='raw';text(details,'summary','查看完整状态与冷却');const cooldowns=Object.fromEntries(Object.entries(p.cooldowns).map(([key,value])=>[key,Math.max(0,value-state.tick)]));text(details,'pre',JSON.stringify({life:p.life,inventory:life.inventory||{},cooldowns,stats:p.stats},null,2));target.appendChild(details)}
function transform(){const canvas=el('field'),padding=40;const scale=Math.min((canvas.width-padding*2)/(bounds.max_x-bounds.min_x),(canvas.height-padding*2)/(bounds.max_z-bounds.min_z))*view.zoom;return {scale,X:x=>canvas.width/2+(x-view.x)*scale,Z:z=>canvas.height/2+(z-view.z)*scale}}
function draw(){const canvas=el('field'),c=canvas.getContext('2d');if(view.follow&&state.players[selected]?.life.kind==='alive'){view.x=state.players[selected].life.spatial.x;view.z=state.players[selected].life.spatial.z}const {scale,X,Z}=transform();c.clearRect(0,0,canvas.width,canvas.height);c.fillStyle='#0a1722';c.fillRect(0,0,canvas.width,canvas.height);
for(const [key,block] of Object.entries(state.terrain)){const [x,y,z]=key.split(',').map(Number);if(y!==-1)continue;c.fillStyle=block.kind==='original'?'#516d7d':'#dec17b';c.fillRect(X(x)+.5,Z(z)+.5,Math.max(1,scale-1),Math.max(1,scale-1))}
for(const [key] of Object.entries(state.terrain)){const [x,y,z]=key.split(',').map(Number);if(y!==0)continue;c.fillStyle='#f6d795';c.fillRect(X(x)+1,Z(z)+1,Math.max(1,scale-2),Math.max(1,scale-2));c.strokeStyle='#795e34';c.lineWidth=1;c.strokeRect(X(x)+1,Z(z)+1,Math.max(1,scale-2),Math.max(1,scale-2))}
for(const gen of map.generators){c.strokeStyle='#80d6bb';c.lineWidth=2;c.beginPath();c.arc(X(gen.position.x),Z(gen.position.z),Math.max(5,scale*.43),0,Math.PI*2);c.stroke()}
for(const team of map.teams){const bed=state.teams[team.team_id].bed_state;c.fillStyle=sideOf(team.team_id)==='red'?'#ff7883':'#7aafff';c.globalAlpha=bed.status==='present'?1:.22;c.fillRect(X(team.bed.x)+2,Z(team.bed.z)+2,Math.max(1,scale-4),Math.max(1,scale-4));c.globalAlpha=1}
for(const item of Object.values(state.entities)){const p=item.spatial;c.fillStyle=item.item_key==='iron'?'#edf4f6':'#ffe09b';c.beginPath();c.arc(X(p.x),Z(p.z),Math.max(3,scale*.14),0,2*Math.PI);c.fill()}
for(const player of Object.values(state.players)){if(player.life.kind!=='alive')continue;const p=player.life.spatial,x=X(p.x),z=Z(p.z),radius=Math.max(7,scale*.3);c.beginPath();c.arc(x,z,radius,0,2*Math.PI);c.fillStyle=sideOf(player.team_id)==='red'?'#ff7883':'#7aafff';c.fill();if(player.player_id===selected){c.lineWidth=2;c.strokeStyle='#fff';c.stroke()}if(player.life.effects.some(e=>e.effect_type==='spawn_protection'&&e.expires_at>state.tick)){c.beginPath();c.arc(x,z,radius+4,0,2*Math.PI);c.strokeStyle='#9aefca';c.lineWidth=2;c.stroke()}c.beginPath();c.moveTo(x,z);c.lineTo(x+p.facing_x*scale*.9,z+p.facing_z*scale*.9);c.strokeStyle='#fff';c.lineWidth=2;c.stroke();c.fillStyle='#fff';c.font='bold 12px sans-serif';c.fillText(player.player_id,x+radius+3,z-radius-2)}}
function selectedStatus(){const result=state.result;if(result)return result.kind==='win'?`${result.winner_team_id} 获胜`:'平局';if(idx===frames.length-1&&data.manifest.summary.failure)return '记录于故障边界结束';if(idx===frames.length-1&&data.manifest.summary.truncated)return '达到外部时限';return '对局进行中'}
function render(){draw();score();inspect();el('slider').value=idx;el('clock').textContent=`tick ${state.tick} / ${frames.at(-1).tick}  ·  ${(state.tick/rate).toFixed(2)} s`;el('match-status').textContent=selectedStatus();el('follow').className='tool'+(view.follow?' active':'')}
function eventActor(f){const p=f.payload||{};return p.player_id||p.team_id||p.winner_team_id||p.target_player_id||'对局'}
function showEvent(f){pause();selectedEvent=f.id;const index=filtered.findIndex(event=>event.id===f.id);if(index>=0)eventPage=Math.floor(index/pageSize);seek(tickToIndex.get(f.happened_at));el('event-detail').textContent=JSON.stringify(f,null,2);renderEventPage()}
function renderEventPage(){const list=el('events');list.replaceChildren();const pages=Math.max(1,Math.ceil(filtered.length/pageSize));eventPage=Math.max(0,Math.min(eventPage,pages-1));el('event-page').textContent=`${eventPage+1} / ${pages}`;el('event-prev-page').disabled=eventPage===0;el('event-next-page').disabled=eventPage>=pages-1;if(!filtered.length){text(list,'span','当前筛选没有事件。','empty');return}for(const f of filtered.slice(eventPage*pageSize,(eventPage+1)*pageSize)){const button=document.createElement('button');button.className='event'+(selectedEvent===f.id?' selected':'');text(button,'b',`TICK ${f.happened_at} · ${timeText(f.happened_at)}`);text(button,'span',`${eventLabel(f)} · ${eventActor(f)}`);button.onclick=()=>showEvent(f);list.appendChild(button)}}
function filterEvents(){const filter=el('filter').value;filtered=facts.filter(f=>significant.has(f.kind)&&tickToIndex.has(f.happened_at)&&(filter==='all'||(filter==='final'?f.kind==='player_died'&&f.payload.final:f.kind===filter)));eventPage=0;el('event-count').textContent=`${filtered.length} 项`;renderEventPage()}
function createMarkers(){const box=el('markers');box.replaceChildren();const span=frames.at(-1).tick-frames[0].tick;for(const event of keyEvents){const marker=document.createElement('button');marker.className='marker '+(event.kind==='bed_destroyed'?'bed':event.kind==='player_died'?'final':'recover');marker.style.left=`${span?100*(event.happened_at-frames[0].tick)/span:0}%`;marker.title=`tick ${event.happened_at} · ${eventLabel(event)}`;marker.setAttribute('aria-label',marker.title);marker.onclick=()=>showEvent(event);box.appendChild(marker)}}
function jumpEvent(direction){const candidates=keyEvents.filter(e=>direction>0?e.happened_at>state.tick:e.happened_at<state.tick);if(candidates.length)showEvent(direction>0?candidates[0]:candidates.at(-1))}
function zoomBy(factor){view.zoom=Math.max(1,Math.min(4,view.zoom*factor));if(view.zoom===1){view.x=(bounds.min_x+bounds.max_x)/2;view.z=(bounds.min_z+bounds.max_z)/2;view.follow=false}render()}
function pointerPosition(event){const rect=el('field').getBoundingClientRect();return {x:(event.clientX-rect.left)*el('field').width/rect.width,z:(event.clientY-rect.top)*el('field').height/rect.height}}
const canvas=el('field');canvas.addEventListener('wheel',event=>{event.preventDefault();zoomBy(event.deltaY<0?1.25:1/1.25)},{passive:false});canvas.addEventListener('pointerdown',event=>{const pos=pointerPosition(event);view.drag={...pos,moved:false};canvas.setPointerCapture(event.pointerId)});canvas.addEventListener('pointermove',event=>{if(!view.drag)return;const pos=pointerPosition(event),dx=pos.x-view.drag.x,dz=pos.z-view.drag.z;if(Math.abs(dx)+Math.abs(dz)>1)view.drag.moved=true;if(view.drag.moved){const scale=transform().scale;view.x-=dx/scale;view.z-=dz/scale;view.follow=false;canvas.classList.add('dragging');render()}view.drag.x=pos.x;view.drag.z=pos.z});canvas.addEventListener('pointerup',event=>{if(!view.drag)return;const moved=view.drag.moved;view.drag=null;canvas.classList.remove('dragging');if(moved)return;const pos=pointerPosition(event),t=transform();let closest=null,dist=20;for(const p of Object.values(state.players)){if(p.life.kind!=='alive')continue;const point=p.life.spatial,d=Math.hypot(t.X(point.x)-pos.x,t.Z(point.z)-pos.z);if(d<dist){dist=d;closest=p.player_id}}if(closest){selected=closest;render()}});
el('subtitle').textContent=`${data.manifest.match_id} · seed ${data.manifest.seed_hex} · ${frames.length} 个完整边界`;el('team0-label').textContent=map.teams[0].team_id;el('team1-label').textContent=map.teams[1].team_id;el('slider').max=frames.length-1;el('start-label').textContent=`tick ${frames[0].tick}`;el('end-label').textContent=`tick ${frames.at(-1).tick}`;el('slider').oninput=e=>{pause();seek(Number(e.target.value))};el('back').onclick=()=>{pause();seek(idx-1)};el('forward').onclick=()=>{pause();seek(idx+1)};el('previous-event').onclick=()=>jumpEvent(-1);el('next-event').onclick=()=>jumpEvent(1);el('zoom-in').onclick=()=>zoomBy(1.25);el('zoom-out').onclick=()=>zoomBy(1/1.25);el('reset-view').onclick=()=>{view.zoom=1;view.x=(bounds.min_x+bounds.max_x)/2;view.z=(bounds.min_z+bounds.max_z)/2;view.follow=false;render()};el('follow').onclick=()=>{view.follow=!view.follow;if(view.follow&&view.zoom<1.75)view.zoom=1.75;render()};el('play').onclick=()=>{if(idx===frames.length-1)seek(0);playing=!playing;last=0;el('play').textContent=playing?'❚❚ 暂停':'▶ 播放'};el('filter').onchange=filterEvents;el('event-prev-page').onclick=()=>{eventPage--;renderEventPage()};el('event-next-page').onclick=()=>{eventPage++;renderEventPage()};window.addEventListener('keydown',e=>{if(['SELECT','INPUT','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();pause();seek(idx+(e.key==='ArrowLeft'?-1:1))}else if(e.key===' '){e.preventDefault();el('play').onclick()}});
function animate(time){if(playing){if(last)acc+=(time-last)*rate*Number(el('speed').value)/1000;last=time;const n=Math.floor(acc);if(n){acc-=n;seek(idx+n);if(idx===frames.length-1)pause()}}else last=0;requestAnimationFrame(animate)}
selected=data.definitions.scenario.players[0]?.player_id||null;createMarkers();filterEvents();render();requestAnimationFrame(animate);
</script>
