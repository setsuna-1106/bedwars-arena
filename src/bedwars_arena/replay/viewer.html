<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BedWars Arena · L1 回放</title>
<style>
:root{color-scheme:dark;--bg:#0b111a;--panel:#111c29;--border:#27384c;--text:#ecf4fc;--muted:#9caebe;--accent:#67d9b8;--red:#ff6b74;--blue:#70aaff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#17283c,var(--bg) 65%);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 26px 14px;max-width:1600px;margin:auto}h1{font-size:20px;margin:0;letter-spacing:.02em}header p{margin:4px 0 0;color:var(--muted);font-size:12px}header .badge{border:1px solid #3d685f;border-radius:100px;padding:5px 10px;color:var(--accent);font-size:12px;white-space:nowrap}
main{max-width:1600px;margin:auto;padding:0 24px 24px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.panel{background:rgba(17,28,41,.96);border:1px solid var(--border);border-radius:12px;overflow:hidden}.topline{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border)}.topline strong{font-size:14px}.sub{color:var(--muted);font-size:12px}
.canvas-wrap{padding:12px;background:#0e1722}canvas{display:block;width:100%;height:auto;aspect-ratio:2/1;background:#091421;border-radius:7px}.legend{display:flex;gap:14px;flex-wrap:wrap;padding:9px 16px 12px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}.controls{border-top:1px solid var(--border);padding:14px 16px}.buttons{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,select{border:1px solid #3b5067;border-radius:7px;background:#1d3043;color:var(--text);padding:7px 11px;font:inherit;cursor:pointer}button:hover,select:hover{background:#2a4058}button.primary{background:#80dfbf;color:#10231f;border-color:#80dfbf;font-weight:700}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #7ddcc4;outline-offset:2px}.clock{font-variant-numeric:tabular-nums;color:#d8ecf6;margin-left:auto}.slider{display:block;width:100%;accent-color:#76dabb;margin:14px 0 2px;cursor:pointer}
.players{padding:8px 14px;max-height:590px;overflow:auto}.team{margin:5px 0 2px;font-size:11px;letter-spacing:.09em;font-weight:700;color:var(--muted)}.player{display:block;text-align:left;width:100%;margin:6px 0;padding:9px 10px;background:#162536;border:1px solid #2b3f53;cursor:pointer}.player.selected{border-color:#8ee1c7}.player-title{display:flex;justify-content:space-between;font-weight:700}.player-details{color:#bed0df;font-size:12px;white-space:pre-wrap;margin-top:5px;overflow-wrap:anywhere}.health{height:4px;border-radius:3px;background:#304154;margin:7px 0}.health span{display:block;height:100%;border-radius:3px;background:#79dba5}.bed-red{color:var(--red)}.bed-blue{color:var(--blue)}
.timeline{margin-top:14px}.timeline .topline{gap:10px;flex-wrap:wrap}.event-list{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;min-height:78px}.event{flex:0 0 auto;text-align:left;max-width:240px;font-size:12px}.event b{display:block;color:#a6ead4;font-variant-numeric:tabular-nums}.empty{color:var(--muted);padding:9px}.detail{padding:0 16px 14px;color:#c8d8e5;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,monospace}.warning{color:#f2bd79}
@media(max-width:900px){.layout{grid-template-columns:1fr}.players{max-height:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.team{grid-column:1/-1}header{padding:14px 16px}main{padding:0 12px 16px}.clock{margin-left:0}canvas{aspect-ratio:1.8/1}}
</style>
</head>
<body>
<header><div><h1>BedWars Arena <span style="color:#81dec2">/</span> L1 回放</h1><p id="subtitle"></p></div><span class="badge">离线 · 记录驱动</span></header>
<main><div class="layout"><section class="panel"><div class="topline"><strong>三岛战场</strong><span class="sub" id="match-status"></span></div><div class="canvas-wrap"><canvas id="field" width="1280" height="640" aria-label="二维战场回放"></canvas></div><div class="legend"><span><i class="dot" style="background:#65798a"></i>原始地面</span><span><i class="dot" style="background:#e5c97c"></i>羊毛桥 / 墙</span><span><i class="dot" style="background:#ff6b74"></i>红队</span><span><i class="dot" style="background:#70aaff"></i>蓝队</span><span><i class="dot" style="background:#e3edf1"></i>地面物品</span></div><div class="controls"><div class="buttons"><button id="back" title="上一个 tick">◀ 单步</button><button id="play" class="primary">▶ 播放</button><button id="forward" title="下一个 tick">单步 ▶</button><label class="sub" for="speed">速度</label><select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option></select><span class="clock" id="clock"></span></div><input class="slider" id="slider" type="range" min="0" max="0" value="0" aria-label="回放时间轴"><div class="sub">拖动时间轴或使用左右方向键逐 tick 查看；播放只显示记录，不推进世界。</div></div></section><aside class="panel"><div class="topline"><strong>队伍与玩家</strong><span class="sub">点击切换详情</span></div><div class="players" id="players"></div><div class="detail" id="player-detail"></div></aside></div><section class="panel timeline"><div class="topline"><div><strong>事件定位</strong> <span class="sub" id="event-count"></span></div><select id="filter" aria-label="筛选事件"><option value="all">所有关键事件</option><option value="block_broken">羊毛回收 / 拆除</option><option value="bed_destroyed">床被破坏</option><option value="final">失床后最终淘汰</option><option value="movement_collision">碰撞</option><option value="melee_hit">近战命中</option><option value="item_purchased">购买</option><option value="block_placed">放置方块</option></select></div><div class="event-list" id="events"></div><div class="detail" id="event-detail">选择事件以查看其原始记录。</div></section></main>
<script>
'use strict';
const data=/*__REPLAY_DATA__*/;
const frames=data.frames, facts=data.events, map=data.definitions.map, profile=data.definitions.profile;
const el=id=>document.getElementById(id);let selected=null,idx=0,playing=false,last=0,acc=0;
let state=structuredClone(data.initial_state);const cache=new Map([[0,structuredClone(state)]]);
const tickToIndex=new Map(frames.map((f,i)=>[f.tick,i]));
const labels={player_spawned:'玩家出生',resource_generated:'资源生成',item_picked_up:'拾取物品',item_purchased:'购买',block_placed:'放置方块',block_broken:'拆除方块',bed_destroyed:'床被破坏',movement_collision:'碰撞',melee_hit:'近战命中',attack_blocked:'攻击被阻挡',player_died:'玩家死亡',player_respawned:'复活',team_eliminated:'队伍淘汰',match_finished:'对局结束',protection_expired:'保护结束',resource_dropped:'丢弃资源'};
const significant=new Set(['block_broken','bed_destroyed','movement_collision','player_died','player_respawned','melee_hit','item_purchased','block_placed','team_eliminated','match_finished']);
function apply(ops){for(const op of ops){let obj=state;for(const key of op.path.slice(0,-1))obj=obj[key];const key=op.path.at(-1);if(op.op==='delete')delete obj[key];else obj[key]=structuredClone(op.value)}}
function seek(target){target=Math.max(0,Math.min(frames.length-1,target));if(target<idx){let start=0;for(const key of cache.keys())if(key<=target&&key>start)start=key;state=structuredClone(cache.get(start));idx=start}while(idx<target){idx++;apply(frames[idx].changes);if(idx%100===0&&!cache.has(idx))cache.set(idx,structuredClone(state))}render()}
function safe(v){return v===null?'—':String(v)}
function draw(){const canvas=el('field'),c=canvas.getContext('2d'),b=map.bounds;const pad=38;const sx=(canvas.width-2*pad)/(b.max_x-b.min_x),sz=(canvas.height-2*pad)/(b.max_z-b.min_z),scale=Math.min(sx,sz);const ox=(canvas.width-(b.max_x-b.min_x)*scale)/2,oz=(canvas.height-(b.max_z-b.min_z)*scale)/2;const X=x=>ox+(x-b.min_x)*scale,Z=z=>oz+(z-b.min_z)*scale;
c.clearRect(0,0,canvas.width,canvas.height);c.fillStyle='#0b1825';c.fillRect(0,0,canvas.width,canvas.height);
for(const [key,block] of Object.entries(state.terrain)){const [x,y,z]=key.split(',').map(Number);if(y!==-1)continue;c.fillStyle=block.kind==='original'?'#52697a':'#d1b36a';c.fillRect(X(x)+.5,Z(z)+.5,scale-1,scale-1)}
for(const [key,block] of Object.entries(state.terrain)){const [x,y,z]=key.split(',').map(Number);if(y!==0)continue;c.fillStyle='#f4d693';c.fillRect(X(x)+1,Z(z)+1,scale-2,scale-2);c.strokeStyle='#6e532a';c.strokeRect(X(x)+1,Z(z)+1,scale-2,scale-2)}
for(const gen of map.generators){c.strokeStyle='#95ddcb';c.lineWidth=1.5;c.beginPath();c.arc(X(gen.position.x),Z(gen.position.z),scale*.45,0,Math.PI*2);c.stroke()}
for(const team of map.teams){const bed=state.teams[team.team_id].bed_state;c.fillStyle=team.team_id==='red'?'#ff6b74':'#70aaff';c.globalAlpha=bed.status==='present'?1:.25;c.fillRect(X(team.bed.x)+2,Z(team.bed.z)+2,scale-4,scale-4);c.globalAlpha=1}
for(const item of Object.values(state.entities)){const p=item.spatial;c.fillStyle=item.item_key==='iron'?'#e6eff3':'#f1d58c';c.beginPath();c.arc(X(p.x),Z(p.z),Math.max(3,scale*.14),0,2*Math.PI);c.fill()}
for(const player of Object.values(state.players)){if(player.life.kind!=='alive')continue;const p=player.life.spatial,x=X(p.x),z=Z(p.z);c.beginPath();c.arc(x,z,Math.max(6,scale*.3),0,2*Math.PI);c.fillStyle=player.team_id==='red'?'#ff6b74':'#70aaff';c.fill();if(player.player_id===selected){c.lineWidth=2;c.strokeStyle='#fff';c.stroke()}if(player.life.effects.some(e=>e.effect_type==='spawn_protection'&&e.expires_at>state.tick)){c.beginPath();c.arc(x,z,Math.max(9,scale*.42),0,2*Math.PI);c.strokeStyle='#a3f1c8';c.lineWidth=2;c.stroke()}c.beginPath();c.moveTo(x,z);c.lineTo(x+p.facing_x*scale*.8,z+p.facing_z*scale*.8);c.strokeStyle='#fff';c.lineWidth=2;c.stroke();c.fillStyle='#fff';c.font='bold 12px sans-serif';c.fillText(player.player_id,x+8,z-8)} }
function text(parent,tag,value,cls){const n=document.createElement(tag);if(cls)n.className=cls;n.textContent=value;parent.appendChild(n);return n}
function showPlayers(){const panel=el('players');panel.replaceChildren();for(const team of map.teams){const s=state.teams[team.team_id].bed_state;const head=text(panel,'div',`${team.team_id.toUpperCase()}  ·  床${s.status==='present'?'存活':'已破坏'}`,'team bed-'+team.team_id);for(const entry of data.definitions.scenario.players.filter(p=>p.team_id===team.team_id)){const p=state.players[entry.player_id],life=p.life;const card=document.createElement('button');card.className='player'+(selected===p.player_id?' selected':'');card.onclick=()=>{selected=p.player_id;render()};const title=text(card,'div',`${p.player_id}   ·   ${life.kind==='alive'?'存活':life.kind==='respawning'?'等待复活':'已淘汰'}`,'player-title');if(life.kind==='alive'){const bar=document.createElement('div');bar.className='health';const fill=document.createElement('span');fill.style.width=`${Math.max(0,life.vitality.health/profile.combat.max_hp*100)}%`;bar.appendChild(fill);card.appendChild(bar);let effects=life.effects.filter(e=>e.effect_type==='spawn_protection'&&e.expires_at>state.tick);text(card,'div',`HP ${life.vitality.health.toFixed(1)} / ${profile.combat.max_hp}  ·  手持 ${safe(life.held_item)}${effects.length?'  ·  保护 '+(effects[0].expires_at-state.tick)+'t':''}`,'player-details')}else if(life.kind==='respawning')text(card,'div',`预计 tick ${life.respawn_at} 复活`,'player-details');panel.appendChild(card)}}
const p=state.players[selected];if(!p){el('player-detail').textContent='选择一名玩家查看背包、动作与冷却。';return}if(p.life.kind!=='alive'){el('player-detail').textContent=JSON.stringify({life:p.life,stats:p.stats},null,2);return}const l=p.life,cd=Object.fromEntries(Object.entries(p.cooldowns).map(([k,v])=>[k,Math.max(0,v-state.tick)]));el('player-detail').textContent=JSON.stringify({位置:{x:l.spatial.x,z:l.spatial.z},背包:l.inventory,移动:l.movement,交互:l.interaction,冷却剩余tick:cd},null,2)}
function eventLabel(f){let s=labels[f.kind]||f.kind;if(f.kind==='player_died'&&f.payload.final)s='失床后最终淘汰';if(f.kind==='block_broken'&&f.payload.recovery&&(f.payload.recovery.received||f.payload.recovery.dropped||f.payload.recovery.destroyed))s='拆除与羊毛回收';return s}
function filterEvents(){let f=el('filter').value;const relevant=facts.filter(e=>significant.has(e.kind)&&tickToIndex.has(e.happened_at)&&(f==='all'||(f==='final'?e.kind==='player_died'&&e.payload.final:e.kind===f)));el('event-count').textContent=`${relevant.length} 项`;const list=el('events');list.replaceChildren();if(!relevant.length){text(list,'span','当前筛选没有事件。','empty');return}for(const e of relevant){const button=document.createElement('button');button.className='event';const b=document.createElement('b');b.textContent=`tick ${e.happened_at} · ${eventLabel(e)}`;button.appendChild(b);text(button,'span',e.payload.player_id||e.payload.team_id||e.payload.winner_team_id||'—');button.onclick=()=>{playing=false;el('play').textContent='▶ 播放';seek(tickToIndex.get(e.happened_at));el('event-detail').textContent=JSON.stringify(e,null,2)};list.appendChild(button)}}
function render(){draw();showPlayers();el('slider').value=idx;el('clock').textContent=`tick ${state.tick} / ${frames.at(-1).tick}  ·  ${(state.tick/20).toFixed(2)} s`;const result=state.result;el('match-status').textContent=result?result.kind==='win'?`${result.winner_team_id} 获胜`:'平局':'对局进行中'}
el('subtitle').textContent=`${data.manifest.match_id} · seed ${data.manifest.seed_hex} · ${frames.length} 个完整边界`;el('slider').max=frames.length-1;el('slider').oninput=e=>{playing=false;el('play').textContent='▶ 播放';seek(Number(e.target.value))};el('back').onclick=()=>{playing=false;el('play').textContent='▶ 播放';seek(idx-1)};el('forward').onclick=()=>{playing=false;el('play').textContent='▶ 播放';seek(idx+1)};el('play').onclick=()=>{if(idx===frames.length-1)seek(0);playing=!playing;last=0;el('play').textContent=playing?'❚❚ 暂停':'▶ 播放'};el('filter').onchange=filterEvents;window.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();playing=false;el('play').textContent='▶ 播放';seek(idx+(e.key==='ArrowLeft'?-1:1))}});
function animate(time){if(playing){if(last)acc+=(time-last)*20*Number(el('speed').value)/1000;last=time;const n=Math.floor(acc);if(n){acc-=n;seek(idx+n);if(idx===frames.length-1){playing=false;el('play').textContent='▶ 播放'}}}else last=0;requestAnimationFrame(animate)}
selected=data.definitions.scenario.players[0]?.player_id||null;filterEvents();render();requestAnimationFrame(animate);
</script></body></html>
